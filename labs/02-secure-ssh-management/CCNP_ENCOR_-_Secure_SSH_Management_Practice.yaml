        content: |-
          #!/bin/bash
          set -e
          ip link set dev eth0 up
          ip address flush dev eth0
          ip address add 192.168.10.10/24 dev eth0
          ip route replace default via 192.168.10.1
          echo "PC1 ready: 192.168.10.10/24, gateway 192.168.10.1" >/dev/console
          echo "Test R1 with: ping -c 4 192.168.10.1" >/dev/console
          echo "SSH to older IOS: ssh -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa netadmin@192.168.10.1" >/dev/console
          echo "READY" >/dev/console
          exit 0
