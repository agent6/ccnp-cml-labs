lab:
  description: Configure secure remote router management using a local user database,
    SSH, and VTY line authentication.
  notes: |-
    OBJECTIVE
    Configure secure remote management on R1 using a local user, SSH version 2, and VTY line authentication.

    TOPOLOGY
    PC1 eth0 --- R1 GigabitEthernet0/0

    BASE CONFIGURATION
    - R1 Gi0/0: 192.168.10.1/24
    - PC1 eth0: 192.168.10.10/24
    - PC1 default gateway: 192.168.10.1
    - Console access is available with no login requirement.
    - SSH, local users, RSA keys, and VTY authentication are intentionally not configured.

    REQUIRED CONFIGURATION
    1. Configure the domain name ccnplab.local.
    2. Create local user netadmin with privilege level 15 and secret CcnpLab2026!.
    3. Generate RSA keys with a modulus of at least 2048 bits.
    4. Force SSH version 2.
    5. Configure VTY lines 0 through 4 to authenticate against the local user database.
    6. Permit SSH only on the VTY lines; Telnet must not be accepted.
    7. Set the VTY idle timeout to 5 minutes.
    8. Save the completed configuration.

    BASE CONNECTIVITY CHECK FROM PC1
    ping -c 4 192.168.10.1

    REMOTE ACCESS TEST FROM PC1
    ssh netadmin@192.168.10.1

    Modern OpenSSH clients disable the SHA-1 key-exchange and RSA host-key algorithms offered by this older IOS image. If the client reports no matching key exchange method or host key type, use:
    ssh -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa netadmin@192.168.10.1

    TELNET REJECTION CHECK FROM PC1
    nc -vz 192.168.10.1 23
    The TCP connection to port 23 should fail after SSH-only transport is configured.

    ROUTER VERIFICATION
    show ip ssh
    show ssh
    show crypto key mypubkey rsa
    show running-config | include hostname|ip domain-name|username|ip ssh
    show running-config | section line vty

    SUCCESS CRITERIA
    - PC1 can ping R1.
    - SSH version 2 is enabled.
    - A 2048-bit or stronger RSA key exists.
    - netadmin authenticates through the local user database.
    - The VTY lines accept SSH and reject Telnet.
    - The VTY idle timeout is 5 minutes.
    - The final running configuration is saved.

    OPTIONAL HARDENING
    Configure login blocking after repeated failures and add a login banner. Verify the behavior without locking yourself out of the console.
  title: CCNP ENCOR - Secure SSH Management Practice
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
