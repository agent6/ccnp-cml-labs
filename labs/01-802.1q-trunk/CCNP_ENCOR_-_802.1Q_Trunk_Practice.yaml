lab:
  description: Configure and verify an IEEE 802.1Q trunk between SW1 and SW2.
  notes: |-
    OBJECTIVE
    Configure and verify an 802.1Q trunk between SW1 and SW2.

    TOPOLOGY
    PC1 --- SW1 Gi0/1
              SW1 Gi0/0 --- SW2 Gi0/0
                             SW2 Gi0/1 --- PC2

    BASE CONFIGURATION
    - PC1: 10.10.10.11/24, access VLAN 10
    - PC2: 10.10.10.12/24, access VLAN 10
    - SW1 VLAN 99 SVI: 10.99.99.11/24
    - SW2 VLAN 99 SVI: 10.99.99.12/24
    - VLAN 10: USERS
    - VLAN 20: SERVERS
    - VLAN 99: MANAGEMENT

    YOUR TASK
    1. Configure SW1 Gi0/0 and SW2 Gi0/0 as static 802.1Q trunks.
    2. Set native VLAN 99 on both ends.
    3. Allow only VLANs 10, 20, and 99 across the trunk.
    4. Verify that PC1 can ping PC2.
    5. Verify that SW1 can ping SW2 using the VLAN 99 management addresses.
    6. Confirm trunk status, native VLAN, and allowed/forwarding VLANs.

    USEFUL VERIFICATION
    show interfaces trunk
    show interfaces gigabitEthernet 0/0 switchport
    show vlan brief
    show spanning-tree vlan 10,20,99
    show mac address-table dynamic

    The inter-switch ports intentionally contain only descriptions and no trunk configuration.
  title: CCNP ENCOR - 802.1Q Trunk Practice
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
