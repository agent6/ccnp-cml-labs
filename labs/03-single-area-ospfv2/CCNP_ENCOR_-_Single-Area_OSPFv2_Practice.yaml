lab:
  description: Configure single-area OSPFv2 between three routers and verify full
    route exchange.
  notes: |-
    OBJECTIVE
    Configure single-area OSPFv2 between R1, R2, and R3 and verify complete IPv4 route exchange.

    TOPOLOGY
                     R1
                    /  \
                   /    \
                 R2------R3

    ADDRESSING
    - R1 Loopback0: 1.1.1.1/32
    - R2 Loopback0: 2.2.2.2/32
    - R3 Loopback0: 3.3.3.3/32
    - R1 G0/0: 10.12.0.1/30; R2 G0/0: 10.12.0.2/30
    - R2 G0/1: 10.23.0.1/30; R3 G0/0: 10.23.0.2/30
    - R1 G0/1: 10.13.0.1/30; R3 G0/1: 10.13.0.2/30

    BASE CONFIGURATION
    - Hostnames, interface descriptions, IPv4 addresses, and console usability are configured.
    - All routed interfaces are enabled.
    - OSPF is intentionally not configured.

    REQUIRED CONFIGURATION
    1. Verify every directly connected neighbor is reachable before configuring OSPF.
    2. Configure OSPFv2 process 10 on R1, R2, and R3.
    3. Use each router's Loopback0 address as its OSPF router ID.
    4. Place every transit interface and Loopback0 in area 0.
    5. Advertise all assigned IPv4 networks while preventing unnecessary OSPF hellos on Loopback0.
    6. Save the completed configuration on all routers.

    BASE CONNECTIVITY CHECKS
    R1: ping 10.12.0.2 and ping 10.13.0.2
    R2: ping 10.12.0.1 and ping 10.23.0.2
    R3: ping 10.23.0.1 and ping 10.13.0.1

    ROUTER VERIFICATION
    show ip ospf neighbor
    show ip ospf interface brief
    show ip protocols
    show ip route ospf
    show ip ospf database router

    END-TO-END TESTS
    R1: ping 2.2.2.2 source Loopback0 and ping 3.3.3.3 source Loopback0
    R2: ping 1.1.1.1 source Loopback0 and ping 3.3.3.3 source Loopback0
    R3: ping 1.1.1.1 source Loopback0 and ping 2.2.2.2 source Loopback0

    SUCCESS CRITERIA
    - Every router has two OSPF neighbors in the FULL state.
    - All OSPF interfaces are in area 0.
    - Each router learns both remote loopbacks and the remote transit network as OSPF routes.
    - Source-specific pings between all loopbacks succeed.
    - OSPF router IDs are 1.1.1.1, 2.2.2.2, and 3.3.3.3.
    - Loopback0 is advertised without sending OSPF hellos.
    - The final running configurations are saved.

    OPTIONAL CHALLENGES
    - Compare neighbor states and DR/BDR roles on each Ethernet transit segment.
    - Shut down one transit interface, observe reconvergence, and restore it.
    - Change an OSPF interface cost and predict the preferred path before verifying it.
  title: CCNP ENCOR - Single-Area OSPFv2 Practice
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
